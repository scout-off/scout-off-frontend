name: Contract Integration

on:
  push:
    branches: [main]
    paths:
      - 'lib/contract/**'
      - 'lib/generated/contract/**'
      - 'contracts/**'
      - '.github/workflows/contract-integration.yml'
  pull_request:
    paths:
      - 'lib/contract/**'
      - 'lib/generated/contract/**'
      - 'contracts/**'
      - '.github/workflows/contract-integration.yml'
  workflow_dispatch:

env:
  # Pinned stellar-cli version used to generate typed contract bindings.
  # Bump this together with the committed output under lib/generated/contract/.
  STELLAR_CLI_VERSION: '21.5.0'
  CONTRACT_SPEC_PATH: 'contracts/spec/contract-spec.json'
  GENERATED_BINDINGS_DIR: 'lib/generated/contract'

jobs:
  bindings-drift:
    name: Contract bindings drift check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned stellar-cli
        run: |
          curl -sSL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin stellar
          stellar --version

      - name: Regenerate typed contract bindings
        run: |
          rm -rf "${GENERATED_BINDINGS_DIR}"
          stellar contract bindings typescript \
            --spec-file "${CONTRACT_SPEC_PATH}" \
            --output-dir "${GENERATED_BINDINGS_DIR}" \
            --overwrite

      - name: Fail on drift
        run: |
          if ! git diff --exit-code -- "${GENERATED_BINDINGS_DIR}"; then
            echo "::error::Committed contract bindings are out of date. Run 'stellar contract bindings typescript --spec-file ${CONTRACT_SPEC_PATH} --output-dir ${GENERATED_BINDINGS_DIR} --overwrite' with stellar-cli v${STELLAR_CLI_VERSION} and commit the result."
            exit 1
          fi

  contract-tests:
    name: Contract integration tests
    runs-on: ubuntu-latest
    needs: bindings-drift
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run contract unit tests
        run: npm test -- --run lib/contract
